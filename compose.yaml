services:
  mysql:
    image: mysql:8.4
    container_name: hby-spring-plus-mysql
    ports:
      - "${DB_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-spring_plus}
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
